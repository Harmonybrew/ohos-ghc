name: Build GHC 9.12.2 OHOS Compiler

on:
  release:
    types: [published]
  push:
    branches: [ "main" ]

env:
  TARGET_TRIPLE: aarch64-unknown-linux-ohos
  GHC_VERSION: "9.12.2"

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt update && sudo apt install -y \
            build-essential \
            binutils-gold \
            unzip \
            xz-utils \
            autoconf \
            python3 \
            libgmp-dev \
            libffi-dev

      - name: Build GHC
        run: ./build.sh --all

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ghc-${{ env.GHC_VERSION }}-ohos-arm64
          path: ghc-ohos-work/ghc-${{ env.GHC_VERSION }}-ohos-arm64.tar.gz

      - name: Upload release asset
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload ${{ github.ref_name }}
          ghc-ohos-work/ghc-${{ env.GHC_VERSION }}-ohos-arm64.tar.gz
          --clobber --repo ${{ github.repository }}
